%YAML:1.0
---
imu: 1         
num_of_cam: 2

imu_topic: "/uav1/mavros/imu/data"
image0_topic: "/left/image_raw"
image1_topic: "/right/image_raw"
output_path: "./output"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 360
   

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

# body_T_cam0: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [-0.01742877,  0.00037385,  0.99984804, -0.02806754,
#         -0.99984651,  0.00178174, -0.01742941,  0.07416613,
#         -0.00178799, -0.99999834,  0.00034274,  0.02806064,
#         0., 0., 0., 1. ]

# body_T_cam1: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [0.00120072, -0.00129134,  0.99999845, -0.02988936,
#         -0.99988941,  0.0148216,   0.00121973, -0.0443707,
#         -0.01482316, -0.99988932, -0.0012734,   0.0255639,
#         0., 0., 0., 1. ]
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.04382351, -0.00326853,  0.99903394,  0.05102916,
         -0.99903645,  0.00252585, -0.04381536, -0.02060059,
         -0.00238020, -0.99999147, -0.00337608, -0.02282604,
         0.00000000,  0.00000000,  0.00000000,  1.00000000]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.02807859, -0.00787589,  0.99957469,  0.04713870,
         -0.99949354,  0.01520206, -0.02795653, -0.09324755,
         -0.01497541, -0.99985342, -0.00829875, -0.02417194,
         0.00000000,  0.00000000,  0.00000000,  1.00000000]
#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 120            # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 15                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
use_marginalization: 0  # experimental: fix the first state instead of using a marginalization prior
max_solver_time: 0.08   # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

acc_n: 0.6        # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.2        # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.01       # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 5.0e-3     # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.805     # gravity magnitude
#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                          # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)
